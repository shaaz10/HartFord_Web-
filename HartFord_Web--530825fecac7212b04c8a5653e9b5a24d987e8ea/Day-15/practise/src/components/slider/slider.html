<div class="bg-slate-100 p-6 rounded-xl max-w-md mx-auto mt-10">
    <h2 class="text-lg font-semibold mb-2">Volume</h2>
  
    <input
      type="range"
      min="0"
      max="100"
      [(ngModel)]="volume"
      class="w-full"
    />
  
    <p class="mt-2 text-center text-2xl font-bold text-indigo-600">
      {{ volume }}%
    </p>
  </div>
