<div class="min-h-screen flex items-center justify-center bg-slate-900">
    <div class="bg-white p-6 rounded-xl w-full max-w-md shadow-xl">
  
      <h2 class="text-xl font-bold mb-4 text-slate-900">
        Live Image Preview
      </h2>
  
      <label class="block text-sm font-medium text-slate-700 mb-1">
        Image URL
      </label>
  
      <input
        type="text"
        [(ngModel)]="imageUrl"
        placeholder="https://picsum.photos/400/250"
        class="w-full px-4 py-2 mb-4 rounded-lg
               bg-white text-black
               border border-gray-300
               placeholder-gray-400
               focus:outline-none
               focus:ring-2 focus:ring-indigo-500
               focus:border-indigo-500"
      />
  
      <img
        [src]="imageUrl || 'https://picsum.photos/400/250'"
        class="rounded-lg w-full object-cover transition"
      />
  
    </div>
  </div>
