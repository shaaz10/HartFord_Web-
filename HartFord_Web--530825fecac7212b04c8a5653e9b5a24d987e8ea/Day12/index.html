<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Insurance Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f6f8;
    }
    h1 {
      text-align: center;
    }
    button {
      margin: 5px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .policy {
      background: #fff;
      padding: 10px;
      margin: 10px 0;
      border-left: 5px solid #4CAF50;
    }
    .inactive {
      border-left-color: red;
    }
    #output {
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>Insurance Mini Project</h1>

<div>
  <button onclick="loadPolicies()">Fetch Policies</button>
  <button onclick="filterPolicies('Health')">Health</button>
  <button onclick="filterPolicies('Life')">Life</button>
  <button onclick="filterPolicies('Vehicle')">Vehicle</button>
  <button onclick="showAll()">Show All</button>
  <button onclick="calculateTotalPremium()">Total Active Premium</button>
  <button onclick="applyDiscount()">Apply Discount</button>
</div>

<div id="output"></div>

<script>
/* ------------------ Local Mock Data ------------------ */
const policiesData = [
  { id: 1, name: "Health Plus", type: "Health", premium: 12000, duration: 1, status: "Active" },
  { id: 2, name: "Life Secure", type: "Life", premium: 9000, duration: 10, status: "Inactive" },
  { id: 3, name: "Car Protect", type: "Vehicle", premium: 7000, duration: 1, status: "Active" },
  { id: 4, name: "Family Health", type: "Health", premium: 15000, duration: 2, status: "Active" }
];

let policies = [];

/* ------------------ Task 1: Fetch Policies ------------------ */
async function fetchPolicies() {
  try {
    await new Promise(resolve => setTimeout(resolve, 1000)); // simulate delay
    policies = policiesData;
    return policies;
  } catch (error) {
    throw new Error("API Fetch Failed");
  }
}

async function loadPolicies() {
  try {
    const data = await fetchPolicies();
    displayPolicies(data);
  } catch (err) {
    showError(err.message);
  }
}

/* ------------------ Task 2: Display Policies ------------------ */
function displayPolicies(data) {
  const output = document.getElementById("output");
  output.innerHTML = "";

  data.forEach(policy => {
    const div = document.createElement("div");
    div.className = "policy " + (policy.status === "Inactive" ? "inactive" : "");
    div.innerHTML = `
      <strong>${policy.name}</strong><br>
      Type: ${policy.type}<br>
      Premium: ₹${policy.premium}<br>
      Duration: ${policy.duration} year(s)<br>
      Status: ${policy.status}<br>
      <button onclick="purchasePolicy(${policy.id})">Buy Policy</button>
    `;
    output.appendChild(div);
  });
}

/* ------------------ Task 3: Filter Policies ------------------ */
function filterPolicies(type) {
  const filtered = policies.filter(p => p.type === type);
  displayPolicies(filtered);
}

function showAll() {
  displayPolicies(policies);
}

/* ------------------ Task 4: Total Premium (reduce) ------------------ */
function calculateTotalPremium() {
  try {
    const total = policies
      .filter(p => p.status === "Active")
      .reduce((sum, p) => sum + p.premium, 0);

    alert("Total Active Premium: ₹" + total);
  } catch {
    showError("Premium Calculation Error");
  }
}

/* ------------------ Task 5: Discount Logic (map) ------------------ */
function applyDiscount() {
  policies = policies.map(p => {
    if (p.premium > 10000) {
      return { ...p, premium: p.premium * 0.9 };
    }
    return p;
  });
  displayPolicies(policies);
}

/* ------------------ Task 6: Callback Simulation ------------------ */
function approvePolicyCallback(id, callback) {
  setTimeout(() => {
    const policy = policies.find(p => p.id === id);
    if (!policy) callback("Invalid Policy ID");
    else callback(null, "Policy Approved: " + policy.name);
  }, 2000);
}

/* ------------------ Task 7: Promise-based Purchase ------------------ */
function approvePolicyPromise(id) {
  return new Promise((resolve, reject) => {
    approvePolicyCallback(id, (err, msg) => {
      if (err) reject(err);
      else resolve(msg);
    });
  });
}

async function purchasePolicy(id) {
  try {
    const message = await approvePolicyPromise(id);
    alert(message);
  } catch (error) {
    showError(error);
  }
}

/* ------------------ Task 8: Error Handling ------------------ */
function showError(msg) {
  alert("Error: " + msg);
}
</script>

</body>
</html>
