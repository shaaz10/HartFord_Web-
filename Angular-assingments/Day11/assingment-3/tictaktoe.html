<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>

  <!-- Stable Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .cell {
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .cell:hover {
      transform: scale(1.08);
      background: rgba(255,255,255,0.35);
    }
    .winner {
      background: #22c55e !important;
      color: white;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-700">

  <div class="bg-white/20 backdrop-blur-xl p-6 rounded-2xl shadow-2xl text-center w-[90%] max-w-sm">
    
    <h1 class="text-3xl font-bold text-white mb-3">
      Tic Tac Toe
    </h1>

    <p id="status" class="text-white text-lg mb-4">
      Player ❌ Turn
    </p>

    <!-- Board -->
    <div class="grid grid-cols-3 gap-3 mb-5">
      <button class="cell w-20 h-20 sm:w-24 sm:h-24 text-4xl font-bold bg-white/30 rounded-xl"></button>
      <button class="cell w-20 h-20 sm:w-24 sm:h-24 text-4xl font-bold bg-white/30 rounded-xl"></button>
      <button class="cell w-20 h-20 sm:w-24 sm:h-24 text-4xl font-bold bg-white/30 rounded-xl"></button>

      <button class="cell w-20 h-20 sm:w-24 sm:h-24 text-4xl font-bold bg-white/30 rounded-xl"></button>
      <button class="cell w-20 h-20 sm:w-24 sm:h-24 text-4xl font-bold bg-white/30 rounded-xl"></button>
      <button class="cell w-20 h-20 sm:w-24 sm:h-24 text-4xl font-bold bg-white/30 rounded-xl"></button>

      <button class="cell w-20 h-20 sm:w-24 sm:h-24 text-4xl font-bold bg-white/30 rounded-xl"></button>
      <button class="cell w-20 h-20 sm:w-24 sm:h-24 text-4xl font-bold bg-white/30 rounded-xl"></button>
      <button class="cell w-20 h-20 sm:w-24 sm:h-24 text-4xl font-bold bg-white/30 rounded-xl"></button>
    </div>

    <button onclick="resetGame()"
      class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-xl font-semibold">
      Restart
    </button>

  </div>

<script>
  const cells = document.querySelectorAll(".cell");
  const statusText = document.getElementById("status");

  let currentPlayer = "❌";
  let gameActive = true;

  const winPatterns = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  cells.forEach((cell, index) => {
    cell.addEventListener("click", () => handleClick(cell, index));
  });

  function handleClick(cell) {
    if (!gameActive || cell.textContent !== "") return;

    cell.textContent = currentPlayer;

    if (checkWinner()) {
      statusText.textContent = `Player ${currentPlayer} Wins 🎉`;
      gameActive = false;
      return;
    }

    if ([...cells].every(c => c.textContent !== "")) {
      statusText.textContent = "Draw 🤝";
      gameActive = false;
      return;
    }

    currentPlayer = currentPlayer === "❌" ? "⭕" : "❌";
    statusText.textContent = `Player ${currentPlayer} Turn`;
  }

  function checkWinner() {
    for (let pattern of winPatterns) {
      const [a,b,c] = pattern;
      if (
        cells[a].textContent &&
        cells[a].textContent === cells[b].textContent &&
        cells[a].textContent === cells[c].textContent
      ) {
        cells[a].classList.add("winner");
        cells[b].classList.add("winner");
        cells[c].classList.add("winner");
        return true;
      }
    }
    return false;
  }

  function resetGame() {
    cells.forEach(cell => {
      cell.textContent = "";
      cell.classList.remove("winner");
    });
    currentPlayer = "❌";
    gameActive = true;
    statusText.textContent = "Player ❌ Turn";
  }
</script>

</body>
</html>
